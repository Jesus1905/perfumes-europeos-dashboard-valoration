name: Captura diaria de valoraciones

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 06:00 hora de Lima
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: captura-diaria
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo (rama main)
        uses: actions/checkout@v4

      - name: Preparar la rama data (donde vive el histórico)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data:data
            git worktree add data-branch data
          else
            echo "La rama data no existe todavía: se crea vacía."
            git worktree add --detach data-branch
            cd data-branch
            git checkout --orphan data
            git rm -rf . > /dev/null 2>&1 || true
          fi

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar Google y actualizar el histórico
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          OUT_DIR: data-branch
        run: node scripts/capturar.mjs

      - name: Guardar el histórico en la rama data
        working-directory: data-branch
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Captura $(TZ=America/Lima date +%F)"
            git push origin data
          fi
